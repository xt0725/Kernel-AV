[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kernel-av"
version = "0.1.0"
description = "A defensive, explainable endpoint scanner for Windows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kernel-AV contributors" }]
dependencies = [
    "psutil>=6,<8",
    "watchdog>=5,<7",
]

[project.optional-dependencies]
yara = ["yara-python>=4.5,<5"]

[project.scripts]
kernel-av = "kernel_av.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kernel_av"]
