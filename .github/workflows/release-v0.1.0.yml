name: release-v0.1.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v0.1.0.yml
      - kernel_av_launcher.py
      - RELEASE_NOTES.md
      - src/kernel_av/cli.py

permissions:
  contents: write

jobs:
  windows-executable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install ".[yara]" "pyinstaller>=6,<7"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build standalone executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --console
          --name Kernel-AV
          --paths src
          --add-data "rules;rules"
          --collect-all yara
          --collect-all watchdog
          --hidden-import psutil
          kernel_av_launcher.py
      - name: Smoke-test executable
        run: .\dist\Kernel-AV.exe --help
      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 .\dist\Kernel-AV.exe).Hash.ToLower()
          "$hash  Kernel-AV.exe" | Set-Content -Encoding ascii .\dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Kernel-AV-v0.1.0-windows
          path: |
            dist/Kernel-AV.exe
            dist/SHA256SUMS.txt
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v0.1.0 --title "Kernel-AV v0.1.0" --notes-file RELEASE_NOTES.md
          gh release upload v0.1.0 .\dist\Kernel-AV.exe .\dist\SHA256SUMS.txt --clobber
