name: release-v0.2.0-native-installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release-v0.2.0.yml
      - native/**
      - RELEASE_NOTES_v0.2.0.md
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v0.2.0.yml
      - native/**
      - RELEASE_NOTES_v0.2.0.md

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test native service
        run: dotnet test native/KernelAV.Service.Tests/KernelAV.Service.Tests.csproj -c Release
      - name: Publish native service
        run: >-
          dotnet publish native/KernelAV.Service/KernelAV.Service.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:PublishReadyToRun=true
          -o ${{ github.workspace }}\publish
      - name: Smoke-test native executable
        run: .\publish\KernelAV.Service.exe --self-test
      - name: Install WiX
        run: dotnet tool install --global wix --version 4.0.6
      - name: Build MSI
        run: >-
          wix build native/installer/Product.wxs
          -arch x64
          -d PublishDir=${{ github.workspace }}\publish
          -o dist\Kernel-AV-v0.2.0-x64.msi
      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 .\dist\Kernel-AV-v0.2.0-x64.msi).Hash.ToLower()
          "$hash  Kernel-AV-v0.2.0-x64.msi" | Set-Content -Encoding ascii .\dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Kernel-AV-v0.2.0-native-installer
          path: |
            dist/Kernel-AV-v0.2.0-x64.msi
            dist/SHA256SUMS.txt
      - name: Publish v0.2.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if (gh release view v0.2.0 2>$null) {
            gh release edit v0.2.0 --title "Kernel-AV v0.2.0" --notes-file RELEASE_NOTES_v0.2.0.md
          } else {
            gh release create v0.2.0 --target main --title "Kernel-AV v0.2.0" --notes-file RELEASE_NOTES_v0.2.0.md
          }
          gh release upload v0.2.0 .\dist\Kernel-AV-v0.2.0-x64.msi .\dist\SHA256SUMS.txt --clobber
